name: GTM version-aware source checks
on:
  push:
    branches: [main, release-prep/**]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Version and source integrity
        run: |
          python3 - <<'PY'
          import json,pathlib,re
          root=pathlib.Path('.')
          package=json.loads((root/'package.json').read_text())
          plugin=json.loads((root/'plugin.json').read_text())
          version=package['version']
          assert re.fullmatch(r'\d+\.\d+\.\d+',version)
          assert version==plugin['version']
          assert plugin['author']=='Valentine'
          js=(root/'dist/index.js').read_text()
          assert f'const GTM_VERSION = "{version}";' in js
          assert version in (root/'README.md').read_text()
          assert (root/'main.py').exists()
          assert (root/'visualizer-packs').is_dir()
          if version=='4.5.8':
              assert (root/'docs/RELEASE_NOTES_4.5.8.md').exists()
              assert 'gtm405ReceiveExternal' in js
          elif version=='4.4.9':
              assert (root/'docs/RELEASE_NOTES_4.4.9.md').exists()
          print('PASS GTM runtime', version)
          PY
          node --check dist/index.js
          python3 -m py_compile main.py
      - name: Legacy 4.4.9 tests (when available)
        run: |
          VERSION="$(python3 -c 'import json;print(json.load(open("package.json"))["version"])')"
          if [[ "$VERSION" == "4.4.9" ]]; then
            for test in GTM_4.4.9_PONG_SCORING_REGRESSION.cjs GTM_4.4.9_ALL_MODES_REGRESSION.cjs tests/GTM_4.4.6_SHUFFLE_REGRESSION_TEST.cjs; do
              if [[ -f "$test" ]]; then node "$test"; fi
            done
          else
            echo "New version: legacy fixed-version tests are intentionally not run."
          fi
