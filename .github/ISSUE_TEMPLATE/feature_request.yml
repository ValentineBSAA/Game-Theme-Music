name: "💡 Feature request"
description: "Suggest a practical Game Theme Music improvement for Steam Deck."
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        ## Thanks for helping improve GTM! 🎵
        GTM **4.4.9 is music-first**. The Arcade Spectator page is for autonomous AI-vs-AI visuals, **not playable or multiplayer Arcade games**.
        Please describe the problem you're trying to solve. Ideas are welcome; requests and votes are not guaranteed plans or release dates.
        Check the [community ideas guide](https://github.com/ValentineBSAA/Game-Theme-Music/blob/main/docs/COMMUNITY_FEATURES.md) and [existing requests](https://github.com/ValentineBSAA/Game-Theme-Music/issues) first.
  - type: dropdown
    id: area
    attributes:
      label: "Which part of GTM would this improve?"
      options:
        - "Visual Worlds and animation"
        - "AI-vs-AI Arcade Spectator visualizers"
        - "Color palettes, effects and customization"
        - "Quick Menu, navigation and accessibility"
        - "Default / Couch-TV footer layout"
        - "Game soundtrack playback"
        - "Ambient / Home music"
        - "Steam / Decky Store music"
        - "Playlists, discovery and library management"
        - "Visualizer packs"
        - "ResonaDeck interoperability"
        - "Performance, SteamOS or Decky compatibility"
        - "Something else"
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: "What should be improved?"
      description: "Explain the desired behavior in your own words."
      placeholder: "I'd love to be able to..."
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: "Why would this help?"
      description: "Describe a real situation on your Steam Deck or TV."
      placeholder: "While browsing Steam Home..."
    validations:
      required: true
  - type: textarea
    id: experience
    attributes:
      label: "What would a good result look like?"
      description: "Optional controls, visual behavior or flow."
    validations:
      required: false
  - type: textarea
    id: extra
    attributes:
      label: "Additional information"
      description: "Screenshots or mockups are optional. Do not include passwords or private data."
    validations:
      required: false
