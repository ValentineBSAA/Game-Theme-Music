name: Revert unwanted GTM 4.4.1 release restoration
on:
  push:
    branches: [docs/gtm-449-repository-cleanup]
    paths: [.github/workflows/remove-accidental-gtm-441-release.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  reverse-unwanted-release:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Remove accidental archived release, retain pre-existing historical tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release view V4.4.9 --json tagName,isPrerelease --jq 'select(.tagName=="V4.4.9" and .isPrerelease==false) | .tagName'
          if gh release view V4.4.1 >/dev/null 2>&1; then
            gh release delete V4.4.1 --yes
          fi
          if gh release view V4.4.1 >/dev/null 2>&1; then
            echo "::error::The unwanted archival release still exists"
            exit 1
          fi
          gh release view V4.4.9 --json tagName,isPrerelease --jq 'select(.tagName=="V4.4.9" and .isPrerelease==false) | .tagName'
