name: Build GTM 4.6.0 TEST installer
on:
  push:
    branches:
      - test/4.6.0-context-menu-visibility
    paths:
      - 'dist/index.js'
      - 'main.py'
      - 'package.json'
      - 'plugin.json'
      - 'tests/gtm_460_context_menu.cjs'
      - '.github/workflows/build-460-test.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout private test branch
        uses: actions/checkout@v4
      - name: Validate syntax, settings, and menu behavior
        shell: bash
        run: |
          set -euo pipefail
          node --check dist/index.js
          node tests/gtm_460_context_menu.cjs
          python3 -m py_compile main.py
      - name: Download and authenticate known-good 4.5.8 installer
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-delay 3 \
            --output "$RUNNER_TEMP/base458.zip" \
            "https://github.com/ValentineBSAA/Game-Theme-Music/releases/download/V4.5.8/Game-Theme-Music-4.5.8.zip"
          echo "4c3ace93a998a2dab7c023e507c19ab0dae8b5b5756bc1ea328e3a325b340324  $RUNNER_TEMP/base458.zip" | sha256sum -c -
          echo "GTM_TEST_BASE=$RUNNER_TEMP/base458.zip" >> "$GITHUB_ENV"
      - name: Build directly installable 4.6.0 TEST ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-test
          python3 - <<'PY'
          import hashlib, os, pathlib, zipfile, json
          src=pathlib.Path(os.environ['GTM_TEST_BASE'])
          out=pathlib.Path('dist-test/Game-Theme-Music-4.6.0-TEST.zip')
          base='Game-Theme-Music/'
          overlays=('dist/index.js','main.py','plugin.json','package.json')
          patch={base+name:pathlib.Path(name).read_bytes() for name in overlays}
          assert json.loads(patch[base+'plugin.json'])['version']=='4.6.0'
          assert json.loads(patch[base+'package.json'])['version']=='4.6.0'
          assert b'const GTM_VERSION = "4.6.0";' in patch[base+'dist/index.js']
          assert b'4.6.0' in patch[base+'main.py']
          with zipfile.ZipFile(src) as zin,zipfile.ZipFile(out,'w') as zout:
              assert zin.testzip() is None
              entries=set(zin.namelist())
              assert set(patch)<=entries, f'Missing base files: {set(patch)-entries}'
              assert any('/bin/' in x for x in entries), 'Base installer lacks required executable payload'
              for item in zin.infolist():
                  zout.writestr(item, patch.get(item.filename,zin.read(item.filename)))
          with zipfile.ZipFile(out) as z:
              assert z.testzip() is None
              assert json.loads(z.read(base+'plugin.json'))['version']=='4.6.0'
              assert z.read(base+'dist/index.js')==patch[base+'dist/index.js']
              assert len(z.namelist())==len(entries)
          checksum=hashlib.sha256(out.read_bytes()).hexdigest()
          pathlib.Path('dist-test/SHA256.txt').write_text(f'{checksum}  {out.name}\n')
          print(f'PASS: {out}, {out.stat().st_size} bytes, sha256 {checksum}')
          PY
      - name: Upload private test installer as Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: GTM-4.6.0-TEST-Installer
          path: dist-test/
          if-no-files-found: error
          retention-days: 14
