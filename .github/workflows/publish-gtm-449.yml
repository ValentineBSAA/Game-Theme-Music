name: Publish verified GTM 4.4.9
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-gtm-449.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-gtm-449
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify this exact release is ready to publish
        run: |
          set -euo pipefail
          test "$(python -c "import json;print(json.load(open('plugin.json'))['version'])")" = "4.4.9"
          test "$(python -c "import json;print(json.load(open('package.json'))['version'])")" = "4.4.9"
          test -f docs/RELEASE_NOTES_4.4.9.md
          test -f docs/RELEASE_READINESS_4.4.9.md
          command -v zstd
          python -m pip install --disable-pip-version-check -q Pillow
      - name: Download checksum-pinned original 4.4.1 release
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/gtm441.zip" 'https://github.com/ValentineBSAA/Game-Theme-Music/releases/download/V4.4.1/Game-Theme-Music-4.4.1-PUBLIC-BETA-CHESS-FOCUSED-BOARD.zip'
          echo "f287d2f85eb5e52ec64b38eb4e6702292139e6db128ea379899db88b956cb537  $RUNNER_TEMP/gtm441.zip" | sha256sum -c -
      - name: Reconstruct complete, independently hash-checked 4.4.9 installable ZIP
        run: |
          set -euo pipefail
          python scripts/reconstruct_gtm_449.py \
            --original "$RUNNER_TEMP/gtm441.zip" \
            --payload release-payload/gtm449-source-delta.tar.zst.b64 \
            --output "$RUNNER_TEMP/Game-Theme-Music-4.4.9.zip"
          cd "$RUNNER_TEMP"
          sha256sum Game-Theme-Music-4.4.9.zip > SHA256SUMS.txt
      - name: Run release regression gate
        run: |
          set -euo pipefail
          node --check dist/index.js
          python -m py_compile main.py
          node GTM_4.4.9_PONG_SCORING_REGRESSION.cjs
          node GTM_4.4.9_ALL_MODES_REGRESSION.cjs
          node tests/GTM_4.4.6_SHUFFLE_REGRESSION_TEST.cjs
          python - <<'PY'
          import hashlib,zipfile,pathlib
          js=pathlib.Path('dist/index.js').read_bytes()
          assert hashlib.sha256(js).hexdigest()=='36eef5688c45c538c2c076173dacfbe449f4505807f3ea14807aa9f73e738fa9'
          z=zipfile.ZipFile(__import__('os').environ['RUNNER_TEMP']+'/Game-Theme-Music-4.4.9.zip')
          assert z.testzip() is None and len(z.namelist())==555
          assert z.read('Game-Theme-Music/dist/index.js')==js
          print('PASS exact 4.4.9 code and asset integrity')
          PY
      - name: Create release with installer and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view V4.4.9 >/dev/null 2>&1; then
            echo "::error::V4.4.9 already exists. Refusing to overwrite a public release."
            exit 1
          fi
          gh release create V4.4.9 \
            "$RUNNER_TEMP/Game-Theme-Music-4.4.9.zip" \
            "$RUNNER_TEMP/SHA256SUMS.txt" \
            --target "$GITHUB_SHA" \
            --title "Game Theme Music 4.4.9" \
            --notes-file docs/RELEASE_NOTES_4.4.9.md \
            --latest
      - name: Verify public release asset names
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release view V4.4.9 --json tagName,isDraft,isPrerelease,assets --jq '.tagName,.isDraft,.isPrerelease,.assets[].name'
