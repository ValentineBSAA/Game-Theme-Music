name: Package GTM 4.4.3 music-first DeckFix Store preview
on:
  push:
    branches:
      - refactor/gtm-441-music-first
    paths:
      - .github/workflows/package-gtm-443-store-fix.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-direct-store-zip:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Prepare icon conversion dependency
        run: python3 -m pip install -q --disable-pip-version-check Pillow
      - name: Align frontend version with backend and manifests
        run: |
          set -euo pipefail
          python3 scripts/package_gtm_store_443.py bump
          node --check dist/index.js
          python3 -m py_compile main.py
      - name: Verify original 4.4.1 release for complete binaries
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/gtm-4.4.1.zip" 'https://github.com/ValentineBSAA/Game-Theme-Music/releases/download/V4.4.1/Game-Theme-Music-4.4.1-PUBLIC-BETA-CHESS-FOCUSED-BOARD.zip'
          echo "f287d2f85eb5e52ec64b38eb4e6702292139e6db128ea379899db88b956cb537  $RUNNER_TEMP/gtm-4.4.1.zip" | sha256sum -c -
      - name: Produce and validate single-layer Decky ZIP with embedded GTM icon
        run: |
          set -euo pipefail
          python3 scripts/package_gtm_store_443.py package "$RUNNER_TEMP/gtm-4.4.1.zip" "$RUNNER_TEMP/Game-Theme-Music-4.4.3-MUSIC-FIRST-STORE-FIX.zip"
          sha256sum "$RUNNER_TEMP/Game-Theme-Music-4.4.3-MUSIC-FIRST-STORE-FIX.zip"
      - name: Persist frontend version fix to preview branch only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/index.js
          if git diff --cached --quiet; then
            echo "No source version change"
          else
            git commit -m "fix: align compiled frontend to 4.4.3 store preview"
            git push origin HEAD:refactor/gtm-441-music-first
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: GTM-4.4.3-STORE-FIX-EXTRACT-OUTER-ARTIFACT
          path: ${{ runner.temp }}/Game-Theme-Music-4.4.3-MUSIC-FIRST-STORE-FIX.zip
          retention-days: 30
          if-no-files-found: error
