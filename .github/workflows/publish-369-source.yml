# Historical filename retained for continuity. The old 3.6.9 source-publishing
# workflow was retired: running it would overwrite the newer verified runtime.
name: GTM version-aware source and regression checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Confirm source snapshot and version consistency
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,json,re,hashlib
          root=pathlib.Path(".")
          pkg=json.loads((root/"package.json").read_text())
          plugin=json.loads((root/"plugin.json").read_text())
          version=pkg["version"]
          assert pkg["name"]=="sdh-gamethememusic"
          assert plugin["version"]==version
          assert re.fullmatch(r"\d+\.\d+\.\d+",version)
          assert f'const GTM_VERSION = "{version}";'.encode() in (root/"dist/index.js").read_bytes()
          assert version in (root/"README.md").read_text()
          assert (root/f"docs/RELEASE_NOTES_{version}.md").is_file()
          if version=="4.1.2":
            assert hashlib.sha256((root/"dist/index.js").read_bytes()).hexdigest()=="07974e20eb93e5bd314cc9fa0f74ec9f77acd776204d292ffb102655399c18b9"
            assert hashlib.sha256((root/"main.py").read_bytes()).hexdigest()=="2ade7634d757afe6f9d1ec807a455103883848da684a1038c86a6808b9273569"
          print("PASS GTM",version)
          PY
          python3 -m py_compile main.py
          node --check dist/index.js
      - name: Run version-appropriate offline regression suites
        run: |
          set -euo pipefail
          VERSION="$(python3 -c "import json;print(json.load(open('package.json'))['version'])")"
          if [[ "$VERSION" == "4.1.2" ]]; then
            for script in tests/*-412.cjs tests/GTM_4.1.2_*.cjs; do
              node "$script"
            done
            python3 tests/GTM_4.1.2_BACKEND_POWER_TESTS.py
          elif [[ "$VERSION" == "4.4.2" || "$VERSION" == "4.4.3" ]]; then
            mkdir -p tests/dist
            ln -s ../../dist/index.js tests/dist/index.js
            ln -s ../main.py tests/main.py
            trap 'rm -f tests/dist/index.js tests/main.py; rmdir tests/dist 2>/dev/null || true' EXIT
            for script in tests/GTM_4.3.0_CROSSFADE_REGRESSION_TESTS.cjs tests/GTM_4.3.0_FOCUS_INTEGRATION.cjs tests/GTM_4.3.0_RENDER_PERFORMANCE_TESTS.cjs tests/GTM_4.3.0_SLEEP_MODE_TESTS.cjs; do
              node "$script"
            done
            python3 tests/GTM_4.1.3_BACKEND_POWER_TESTS.py
            python3 - <<'PY'
          import json
          from pathlib import Path
          v=json.loads(Path("visualizer-packs/volume1/manifest.json").read_text())
          e=json.loads(Path("visualizer-packs/experiments/manifest.json").read_text())
          assert len(v["scenes"])==12 and len(e["scenes"])==5
          assert all(not s.get("program") and not s.get("interaction") for s in e["scenes"])
          assert not Path("visualizer-packs/arcade/manifest.json").exists()
          print("PASS GTM", "music-first visual world boundaries")
          PY
          else
            echo "Unsupported source version $VERSION";exit 1
          fi
